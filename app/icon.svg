<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000"/>
  <!-- Left circle -->
  <circle cx="37" cy="50" r="27" stroke="white" stroke-width="4" fill="none"/>
  <!-- Right circle -->
  <circle cx="63" cy="50" r="27" stroke="white" stroke-width="4" fill="none"/>
  <!-- Horizontal line: left edge through intersection to dot -->
  <line x1="12" y1="50" x2="44" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- C-arc: left half-circle of radius 8 centered at intersection, opens right -->
  <path d="M50 42 A8 8 0 0 0 50 58" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6.5" fill="white"/>
</svg>
